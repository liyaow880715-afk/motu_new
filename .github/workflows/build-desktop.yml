name: Build & Release Desktop Clients

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync package version for tagged builds
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        run: node ./scripts/sync-release-version.cjs
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.version || '') }}

      - name: Generate Prisma Client
        run: |
          taskkill /F /IM node.exe 2>$null
          npm run prisma:generate
        shell: pwsh

      - name: Install app-builder dependencies
        run: npx electron-builder install-app-deps
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      # NOTE: --publish never on purpose. On tag builds electron-builder
      # otherwise auto-publishes a draft release, which raced between the
      # win/mac jobs (duplicate drafts) and broke the release job.
      # The release job below is the single publisher.
      - name: Build Windows Installer
        run: npm run dist:win -- --publish never
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: List build outputs
        run: Get-ChildItem dist-desktop/
        shell: pwsh

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist-desktop/*.exe
            dist-desktop/*.blockmap
            dist-desktop/latest.yml

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync package version for tagged builds
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        run: node ./scripts/sync-release-version.cjs
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.version || '') }}

      - name: Generate Prisma Client
        run: npm run prisma:generate

      # NOTE: --publish never on purpose (see build-win).
      - name: Build Mac DMG + ZIP
        run: npm run dist:mac -- --publish never
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List build outputs
        run: ls -la dist-desktop/

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-packages
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.blockmap
            dist-desktop/latest-mac.yml

  release:
    needs: [build-win, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows

      - name: Download Mac artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-packages
          path: artifacts/mac

      - name: Flatten artifacts
        run: |
          mkdir -p release
          cp artifacts/windows/* release/ 2>/dev/null || true
          cp artifacts/mac/* release/ 2>/dev/null || true
          ls -la release/

      - name: Create GitHub Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pre-release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.3-main-${{ github.run_number }}
          name: "v0.4.3 main build #${{ github.run_number }}"
          files: release/*
          prerelease: true
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
